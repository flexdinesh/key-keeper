# Example only. Edit config.yaml for your hosts, paths, and keys before use.
services:
  key-keeper:
    image: ghcr.io/flexdinesh/key-keeper:latest
    environment:
      # actual value: change-me
      OTEL_INGEST_API_KEY_BASE64: Y2hhbmdlLW1l
    volumes:
      - ./config.yaml:/app/config/config.yaml:ro
    expose:
      - "8181"

  caddy:
    image: caddy:2.10
    depends_on:
      - key-keeper
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
